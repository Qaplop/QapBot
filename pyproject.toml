[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "smoke: fast offline unit smoke (no network, no Discord, no CoC)",
    "live: DEV live smoke (network + real Discord; CoC optional depending on test)",
    "integration: requires in-memory DB, mocked APIs",
    "discord: requires mocked Discord client/interaction objects",
    "e2e: end-to-end with live test bot (manual only)",
    "slow: tests that take > 5s individually",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    # aiosqlite worker thread delivers a callback to an already-closed per-test
    # event loop (pytest-asyncio asyncio_mode="auto" tears down the loop before
    # the thread can complete). This is a known benign race; suppress it.
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "qapbot/scripts/*",
    # UI-heavy / bot-lifecycle files: ~90% Discord wiring, not unit-testable
    "qapbot/ui_clan_management.py",
    "QBdiscordcmds.py",
    "QapBot.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.pyright]
# Matches the project-wide VS Code user setting (Pylance / python.analysis.typeCheckingMode:
# strict) so `pyright` on the command line reports the same findings anyone sees in-editor —
# committed here so the strict bar isn't just a personal, undiscoverable machine setting.
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = "venv"
exclude = ["venv", "data", "archive", "archive_old", "__pycache__", ".claude", ".workspace_tools", "**/node_modules", "**/.*"]

# The "unknown type propagated from an untyped source" rule family is turned off project-wide.
# Two untyped sources dominate here: (1) unittest.mock objects (MagicMock/AsyncMock) throughout
# tests/, which are untyped by design — strict mode's reportUnknown* rules otherwise flood test
# files with ~2000+ findings that reflect the mock library, not a real bug; (2) coc.py itself
# has no type stubs (see the `# type: ignore[import-untyped]` on every `import coc`), so any
# attribute pulled off a coc.py object reads as "unknown" even in application code. Tried scoping
# this to tests/ only via `[[tool.pyright.executionEnvironments]]`, but per-environment blocks
# don't reliably inherit the top-level venvPath/venv in this pyright version — repeating
# venvPath/venv inside the block is rejected as "unrecognized setting" and breaks import
# resolution for every file under that root instead. Simpler and more robust to relax these
# specific rules everywhere; every OTHER strict rule (unused imports/code, attribute-access
# issues, call-signature mismatches, deprecated usage, etc.) still applies everywhere including
# tests/.
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"

# reportPrivateUsage is relaxed project-wide for the same "tried scoping to tests/, pyright
# breaks import resolution" reason as the reportUnknown* family above (confirmed again here:
# a `[[tool.pyright.executionEnvironments]]` block scoped to root = "tests" pushed the error
# count from 676 to 2382 by losing venvPath/venv resolution for every file under that root).
# tests/ dominates this rule almost entirely (284 of 297 project-wide hits, 2026-09-05 audit):
# UI/callback tests call a View's private `_on_*` button handler or a module's `_helper`
# directly to simulate a click/invocation without a full Discord dispatch harness — the
# deliberate, standard pattern this test suite uses throughout, not a bug. The handful of
# legitimate cross-module reuses in application code (e.g. web_bridge.py and ui_cwl_roster.py
# calling ui_cwl_roster.py's/QBdiscocmdshelper_cwl.py's `_send_cwl_enrollment_dm_batch` and
# similar helpers on purpose, so two code paths can't drift apart) are each suppressed
# individually at the call site with `# pyright: ignore[reportPrivateUsage]` plus a one-line
# reason instead, so an accidental encapsulation break in new application code still gets
# caught — this project-wide relaxation exists for the test-suite pattern, not to blanket-hide
# the rule everywhere.
reportPrivateUsage = "none"

# reportUnusedFunction is relaxed project-wide for the same reason, a different framework this
# time: a pytest fixture (`@pytest.fixture`, autouse or not) and a discord.py event handler
# (`@client.event`) are both invoked by the framework through runtime name-based dispatch —
# pytest resolves a fixture by matching a test function's parameter name against the fixture
# registry; discord.py looks up `on_ready`/etc. by attribute name on the client — neither is a
# call site pyright's static analysis can see, so it reads as dead code. A 2026-09-05 audit of
# every reportUnusedFunction hit in tests/ found 19 fixtures/event-handlers (real framework
# usage, not a bug) and 7 genuinely-dead helper functions (removed that day, not suppressed).
# Production code gets the same "real dead code, not framework dispatch" treatment when this
# comes up again — this relaxation just stops the framework-dispatch half from being reported
# as if it were.
reportUnusedFunction = "none"
