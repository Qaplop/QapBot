  <!-- White question mark -->
  <path d="M 25 25 C 25 20 28.5 17 32 17 C 35.8 17 39 19.8 39 24 C 39 27.5 37 29 34.5 30.8 C 32.5 32.2 32 33.5 32 36" stroke="white" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <circle cx="32" cy="44" r="3.2" fill="white"/>
</svg>
