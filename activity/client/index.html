<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CWL Clan Config</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #313338;
        color: #f2f3f5;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #app { padding: 16px; }

      .header { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
      .tz-note { margin-bottom: 12px; font-size: 0.8rem; color: #949ba4; }

      table { border-collapse: collapse; width: 100%; }
      th, td { padding: 4px 12px; text-align: left; border-bottom: 1px solid #3f4147; }
      th { color: #949ba4; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.02em; padding-top: 6px; padding-bottom: 6px; }
      tr.inactive td:not(:first-child) { opacity: 0.5; }
      .tier-cell { color: #949ba4; }

      input[type="checkbox"] { width: 16px; height: 16px; accent-color: #5865f2; }
      select, input[type="date"] {
        background: #1e1f22;
        color: #f2f3f5;
        border: 1px solid #3f4147;
        border-radius: 4px;
        padding: 3px 8px;
        font-size: 0.85rem;
      }
      select:disabled, input:disabled { cursor: not-allowed; }
      .start-time-cell { display: flex; gap: 8px; align-items: center; }
      .start-time-cell input[type="date"] { flex: 1; min-width: 0; }

      .footer { margin-top: 16px; display: flex; align-items: center; gap: 12px; }
      .save-button {
        background: #5865f2;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 10px 20px;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
      }
      .save-button:disabled { opacity: 0.6; cursor: default; }
      .cancel-button {
        background: #3f4147;
        color: #f2f3f5;
        border: none;
        border-radius: 4px;
        padding: 10px 20px;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
      }
      .cancel-button:disabled { opacity: 0.6; cursor: default; }
      .save-status { font-size: 0.85rem; color: #949ba4; }
      .save-status.success { color: #23a55a; }
      .save-status.error { color: #f23f42; }

      .board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
      .column {
        flex: 0 0 220px;
        background: #2b2d31;
        border: 1px solid #3f4147;
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        max-height: 70vh;
      }
      .column.column-unassigned { border-color: #4a4d54; }
      .column.drop-target { border-color: #5865f2; background: #32354b; }
      .column-header {
        padding: 8px 10px;
        font-size: 0.8rem;
        font-weight: 600;
        color: #949ba4;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        border-bottom: 1px solid #3f4147;
      }
      .card-list { padding: 8px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
      .player-card {
        background: #1e1f22;
        border: 1px solid #3f4147;
        border-radius: 4px;
        padding: 6px 8px;
        cursor: grab;
      }
      .player-card.dragging { opacity: 0.4; }
      .player-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .th-badge {
        display: flex;
        align-items: center;
        gap: 2px;
        flex-shrink: 0;
        font-size: 0.75rem;
        color: #949ba4;
      }
      .th-icon { width: 16px; height: 16px; }
      .player-name {
        flex: 1;
        min-width: 0;
        font-size: 0.85rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .signup-badge {
        display: inline-block;
        flex-shrink: 0;
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 3px;
        background: #3f4147;
        color: #949ba4;
      }
      .signup-badge.signup-confirmed { background: #1c3a2a; color: #23a55a; }
      .signup-badge.signup-pending { background: #3a3620; color: #e3b341; }
      .signup-badge.signup-declined { background: #3a2226; color: #f23f42; }
    </style>
  </head>
  <body>
    <div id="app">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
