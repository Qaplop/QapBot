<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CWL Clan Config</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #313338;
        color: #f2f3f5;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #app { padding: 16px; }

      .header { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
      .tz-note { margin-bottom: 12px; font-size: 0.8rem; color: #f2f3f5; }

      table { border-collapse: collapse; width: 100%; }
      /* vertical-align: top (2026-08-15, live-testing feedback: "the lines got broken" after
         adding a shared clan) — a shared clan's name cell grows taller than its neighbors (the
         badge wraps below the clan name), and without an explicit vertical-align every column
         defaulted to its own alignment within that taller row — the roster-size select sank
         toward the badge's line while start-time/checkbox stayed anchored near the top, so the
         row's controls no longer lined up with each other or with the clan name. Top-aligning
         every cell keeps all of a row's content anchored to the same line regardless of which
         cell happens to be tallest. */
      th, td { padding: 4px 12px; text-align: left; border-bottom: 1px solid #3f4147; vertical-align: top; }
      th { color: #f2f3f5; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.02em; padding-top: 6px; padding-bottom: 6px; }
      thead th {
        position: sticky;
        /* top offset set inline per-render (clanConfigTable.ts) to the topbar's real height */
        background: #313338;
        z-index: 4;
      }
      tr.inactive td:not(:first-child) { opacity: 0.5; }
      .tier-cell { color: #f2f3f5; }

      /* Cross-guild shared-clan status (2026-08-15, kept inline after live-testing feedback: a
         block-level badge wrapping onto its own line under the clan name made that row taller
         than its neighbors, breaking the table's row alignment even with vertical-align: top —
         staying on the same line as the name/tag keeps every row's height identical regardless
         of sharing status) — plain inline text, no block wrapper; per-row "read-only" wording
         moved to a single general notice below the whole table instead of repeating per-row. */
      .shared-clan-inline { font-size: 0.75rem; color: #f0b232; }
      .shared-clan-readonly-notice {
        margin-top: 10px;
        font-size: 0.8rem;
        color: #f0b232;
      }
      .evict-button {
        margin-left: 8px;
        background: #3f4147;
        color: #f2f3f5;
        border: none;
        border-radius: 4px;
        padding: 2px 8px;
        font-size: 0.7rem;
        cursor: pointer;
      }
      .evict-button:hover:not(:disabled) { background: #f23f42; }
      .evict-button:disabled { opacity: 0.5; cursor: default; }

      input[type="checkbox"] { width: 16px; height: 16px; accent-color: #5865f2; }
      select, input[type="date"], input[type="text"] {
        background: #1e1f22;
        color: #f2f3f5;
        border: 1px solid #3f4147;
        border-radius: 4px;
        padding: 3px 8px;
        font-size: 0.85rem;
      }
      select:disabled, input:disabled { cursor: not-allowed; }
      .start-time-cell { display: flex; gap: 8px; align-items: center; }
      .start-time-cell input[type="date"] { flex: 1; min-width: 0; }

      /* "Guests" invite section (2026-08-15) — Configure Participating Clans' search for
         inviting a clan or individual player from outside this guild's own family. Sits below
         the table, above the Save/Cancel footer, as its own block (not the sticky header — a
         search box + growing results list doesn't belong in a region meant to stay short). */
      .guests-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid #3f4147; }
      .guests-title { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
      .guests-hint { font-size: 0.8rem; color: #949ba4; margin-bottom: 10px; }
      .guests-search-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
      .guests-search-input { flex: 1; min-width: 220px; }
      .guests-dm-label { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #f2f3f5; white-space: nowrap; }
      .guests-results { display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; }
      .guest-result {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        background: #1e1f22;
        border: 1px solid #3f4147;
        border-radius: 4px;
      }
      .guest-result-badge {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        padding: 2px 6px;
        border-radius: 3px;
        flex-shrink: 0;
      }
      .guest-result-badge.clan { background: #2b3a4a; color: #7fb3e0; }
      .guest-result-badge.player { background: #2b3a2f; color: #8fce9d; }
      /* Cross-guild shared-clan highlight (2026-08-15) — a hit already on another guild's
         roster still shows up (never hidden), just visibly flagged before the admin confirms
         adding it anyway. */
      .guest-result.guest-result-shared { border-color: #f0b232; background: #2e2717; }
      .guest-result-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.85rem; }
      .guest-result-note { font-size: 0.75rem; color: #949ba4; flex-shrink: 0; }
      .guest-add-button {
        background: #3f4147;
        color: #f2f3f5;
        border: none;
        border-radius: 4px;
        padding: 4px 10px;
        font-size: 0.8rem;
        cursor: pointer;
        flex-shrink: 0;
      }
      .guest-add-button:hover:not(:disabled) { background: #4a4d54; }
      .guest-add-button:disabled { opacity: 0.5; cursor: default; }
      .guests-status { font-size: 0.8rem; margin-top: 6px; min-height: 1em; }
      .guests-status.success { color: #23a55a; }
      .guests-status.error { color: #f23f42; }

      .footer { margin-top: 16px; display: flex; align-items: center; gap: 12px; }
      .sticky-footer {
        position: sticky;
        bottom: 0;
        background: #313338;
        padding-top: 8px;
        padding-bottom: 8px;
        z-index: 5;
      }
      /* Genuinely fixed band, not sticky — position: sticky only pins an element once the
         document's own scroll would otherwise carry it out of view, which requires the page's
         content to actually be at least as tall as the viewport. The enrollment board's content
         is capped short (.column's fixed max-height) and the surrounding Discord Activity
         panel's height still varies with the user's own window — so on any window taller than
         the (short, fixed) content, this footer just sat wherever plain document flow put it,
         with no defined relationship to the viewport bottom at all. `position: fixed` sidesteps
         document flow and content height entirely — this is always exactly a fixed-height band
         glued to the true bottom of the viewport, independent of both. */
      .footer-fixed {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        margin-top: 0;
        background: #313338;
        padding: 8px 16px;
        box-sizing: border-box;
        border-top: 1px solid #3f4147;
        z-index: 5;
      }
      .save-button {
        background: #5865f2;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 10px 20px;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
      }
      .save-button:disabled { opacity: 0.6; cursor: default; }
      .cancel-button {
        background: #3f4147;
        color: #f2f3f5;
        border: none;
        border-radius: 4px;
        padding: 10px 20px;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
      }
      .cancel-button:disabled { opacity: 0.6; cursor: default; }
      .save-status { font-size: 0.85rem; color: #f2f3f5; }
      .save-status.success { color: #23a55a; }
      .save-status.error { color: #f23f42; }
      .skill-explainer { font-size: 0.75rem; color: #f2f3f5; margin-left: auto; }

      .board-topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        background: #313338;
        padding-top: 2px;
        padding-bottom: 8px;
      }
      .title-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
      .legend { display: flex; align-items: center; gap: 12px; }
      .legend-item { display: flex; align-items: center; gap: 4px; font-size: 0.75rem; color: #f2f3f5; }
      .legend-icon { width: 16px; height: 16px; }
      /* Was an unstyled plain block div — its two .sort-selector children (each display:flex,
         but block-level themselves) stacked one per line by default block flow, with nothing
         actually asking for that. flex here puts "Sort by:" and "Show:" on one line with a
         modest gap between the two groups (live-testing feedback, 2026-08-15); flex-wrap keeps
         it from overflowing on a narrow window. */
      .sort-row { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
      .sort-selector { display: flex; align-items: center; gap: 14px; font-size: 0.8rem; color: #f2f3f5; }
      /* Vertical rule between "Sort by" and "Show" (2026-08-15, live-testing feedback: the plain
         gap alone read as one continuous row of options, not two separate settings groups) —
         border on every selector after the first rather than a one-off class, so a future third
         group gets the same divider for free. */
      .sort-selector:not(:first-child) { padding-left: 28px; border-left: 1px solid rgba(242, 243, 245, 0.25); }
      .sort-label { color: #f2f3f5; }
      .sort-option { display: flex; align-items: center; gap: 4px; cursor: pointer; }
      .sort-option input { accent-color: #5865f2; cursor: pointer; }

      /* height is set inline by enrollmentBoard.ts's resizeBoard() — measured from the actual
         rendered topbar/footer heights and window.innerHeight, so the board fills exactly
         whatever room is really available (and stays correct across a window resize) instead
         of a guessed constant. That already accounts for .footer-fixed's height, so no separate
         margin-bottom reservation is needed here. */
      .board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
      .column {
        flex: 0 0 220px;
        background: #2b2d31;
        border: 1px solid #3f4147;
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        /* No max-height of its own — .board's explicit (JS-computed) height above, combined
           with flexbox's default align-items: stretch, makes every column (short or tall) span
           the full available height; each column's own .card-list overflow-y: auto (below)
           handles internal scrolling for whichever ones have more players than fit. */
      }
      .column.column-unassigned { border-color: #4a4d54; }
      .column.drop-target { border-color: #5865f2; background: #32354b; }
      .column.dragging { opacity: 0.4; }
      .column-header {
        padding: 8px 10px;
        min-height: 50px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        color: #f2f3f5;
        border-bottom: 1px solid #3f4147;
        cursor: grab;
      }
      /* No text-transform: uppercase here — clan names shown exactly as entered, tier shown
         Title Case as the backend already has it ("Master I", not "MASTER I"). */
      .column-header-name {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        line-height: 1.3;
      }
      /* Truncates a long clan name with an ellipsis instead of pushing the count (pinned to the
         right edge via the flex row above) out past the column's fixed width. */
      .column-header-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      .column-header-tier { font-size: 0.72rem; font-weight: 400; line-height: 1.2; }
      .column-count { font-weight: 700; flex-shrink: 0; }
      /* Roster-filled indicator (2026-08-15) — green once (current/roster_size) is met or
         exceeded, amber while still short. Unassigned's count keeps the plain default color
         (no rosterSize class added there at all — see enrollmentBoard.ts's buildColumn()). */
      .column-count.count-met { color: #23a55a; }
      .column-count.count-under { color: #f0b232; }
      .card-list {
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow-y: auto;
        /* Containing block + local stacking context for .roster-band-bg below — position:
           relative alone wouldn't be enough; z-index: 0 is what actually establishes the
           stacking context, which keeps the band's negative z-index scoped to just this
           card-list instead of escaping behind .column's own background. */
        position: relative;
        z-index: 0;
      }
      /* Starting-roster band (positions 1..roster_size) — a light-gray background wash behind
         the starting-roster slots (position 1..roster_size in the column's current sort);
         backup/reserve cards past it sit on the column's normal (current) shade. Open slots
         (fewer real starters than roster_size) are padded out with .placeholder-card tiles so
         the band always shows all roster_size slots.
         This is a separate .roster-band-bg element absolutely positioned *behind* the cards
         (z-index: -1) rather than a box that wraps just the starter cards — starters,
         placeholders, and backups are now all plain siblings in one flat .card-list flex row
         (see enrollmentBoard.ts's buildColumn()), so every card gets its width from the exact
         same flex-stretch computation with nothing to independently round. Two earlier attempts
         (width:calc(100%+16px)+negative-margin, then box-shadow, both on a wrapper around just
         the starters) still left a hairline seam between the last roster card and the first
         backup card in live testing (2026-08-15) — the wrapper's width was always a second,
         independently-rounded computation next to the backups' width. left/right/top: 0 here
         are the .card-list padding-box edges directly (no percentage/calc math at all), and its
         height is set in JS from the real rendered position of the last roster-slot card, so
         there's nothing left to drift. Shade lightened one step from the previous #34363d,
         which read too dark in the same feedback round (earlier iterations used a modest gray
         with its own padding/border-radius, which read as a small floating box, and before that
         plain white, which read as visually harsh — 2026-08-14). */
      .roster-band-bg {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        /* height set inline by enrollmentBoard.ts's renderBoard(), after the column is attached
           to the live board and the last roster-slot card has real layout to measure. */
        background: #3a3c43;
        z-index: -1;
        pointer-events: none;
      }
      .player-card {
        background: #1e1f22;
        border: 1px solid #3f4147;
        border-radius: 4px;
        padding: 6px 4px 6px 8px;
        cursor: grab;
      }
      /* Assigned player's real current clan vs their assignment (2026-08-14) — green already
         moved, amber still needs to transfer. Unassigned cards / unknown current clan keep the
         plain shade above (see enrollmentBoard.ts's clanMatchClass()). */
      .player-card.same-clan { background: #1f3d2a; border-color: #2d6a45; }
      .player-card.different-clan { background: #4a3a1a; border-color: #8a6a2a; }
      /* Guest-invite marker (2026-08-15) — an inset box-shadow, not a border-width change: this
         card grid's row-height/width parity across every column took real work to get right (see
         .roster-band-bg's own comment above), and box-shadow paints without touching the box
         model at all, so this can't perturb any of that. Layers under same-clan/different-clan's
         background override fine since box-shadow paints on top regardless of background color. */
      .player-card.guest-card { box-shadow: inset 3px 0 0 0 #f0b232; }
      .player-card.dragging { opacity: 0.4; }
      /* Open roster slot — no player assigned yet. Not draggable (see buildPlaceholderCard()),
         just a quiet placeholder so the roster band always shows all roster_size slots. No
         height of its own — the invisible .status-icon spacer inside its real .player-row
         (buildPlaceholderCard()) makes it size identically to an actual player card. */
      .placeholder-card {
        background: rgba(0, 0, 0, 0.12);
        border: 1px dashed rgba(255, 255, 255, 0.35);
        cursor: default;
      }
      .player-row {
        display: flex;
        align-items: center;
        gap: 6px;
        /* Explicit, not content-derived — every row now has the same DOM shape (see
           buildCard()'s always-reserved th-badge/status-icon slots), but pinning the height too
           removes any remaining dependency on sub-pixel text line-height rounding, so every
           card (real, green, amber, or placeholder) is byte-for-byte the same height. */
        height: 20px;
      }
      .th-badge {
        display: flex;
        align-items: center;
        gap: 2px;
        flex-shrink: 0;
        font-size: 0.75rem;
        color: #f2f3f5;
      }
      .th-icon { width: 16px; height: 16px; }
      .player-name {
        flex: 1;
        min-width: 0;
        font-size: 0.85rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .skill-score { flex-shrink: 0; font-size: 0.75rem; color: #f2f3f5; }
      .status-icon { width: 16px; height: 16px; flex-shrink: 0; display: block; }
    </style>
  </head>
  <body>
    <div id="app">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
