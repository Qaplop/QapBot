<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CWL Clan Config</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #313338;
        color: #f2f3f5;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #app { padding: 16px; }

      .header { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }

      table { border-collapse: collapse; width: 100%; }
      th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #3f4147; }
      th { color: #949ba4; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.02em; }
      tr.inactive td:not(:first-child) { opacity: 0.5; }
      .tier-cell { color: #949ba4; }

      input[type="checkbox"] { width: 18px; height: 18px; accent-color: #5865f2; }
      select, input[type="date"] {
        background: #1e1f22;
        color: #f2f3f5;
        border: 1px solid #3f4147;
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 0.9rem;
      }
      select:disabled, input:disabled { cursor: not-allowed; }
      .start-time-cell { display: flex; gap: 8px; align-items: center; }
      .start-time-cell input[type="date"] { flex: 1; min-width: 0; }

      .footer { margin-top: 16px; display: flex; align-items: center; gap: 12px; }
      .save-button {
        background: #5865f2;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 10px 20px;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
      }
      .save-button:disabled { opacity: 0.6; cursor: default; }
      .cancel-button {
        background: #3f4147;
        color: #f2f3f5;
        border: none;
        border-radius: 4px;
        padding: 10px 20px;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
      }
      .cancel-button:disabled { opacity: 0.6; cursor: default; }
      .save-status { font-size: 0.85rem; color: #949ba4; }
      .save-status.success { color: #23a55a; }
      .save-status.error { color: #f23f42; }
    </style>
  </head>
  <body>
    <div id="app">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
